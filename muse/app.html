<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#1c1f22">
	<title>Muse</title>
	<meta name="description" content="Muse: draw music on a canvas. Pick an instrument, press and drag. Height picks the note, left to right sets the volume.">
	<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<script src="howler/howler.core.min.js" defer></script>
	<script src="script.js" type="module"></script>
</head>
<body>
	<header class="bar">
		<a class="home" href="../">josh<b>wein</b>.xyz</a>
		<h1>Muse</h1>
		<span class="presence" id="presence" aria-live="polite" hidden></span>
		<div class="instruments" role="radiogroup" aria-label="Instrument">
			<!-- buttons are added by script.js -->
		</div>
	</header>

	<main class="stage">
		<canvas id="stage" aria-label="Music canvas. Press and drag: height picks the note, left to right sets the volume."></canvas>
		<p class="hint" id="hint">Press and drag. Higher is higher pitch, further right is louder. Keys 1 to 8 switch instruments.</p>
	</main>

	<div class="intro" id="intro">
		<form class="card" id="join">
			<h2>Muse</h2>
			<p>A little canvas instrument. Pick a sound, press, and drag to play.</p>
			<label for="username">Name</label>
			<input id="username" type="text" placeholder="MuseMan" maxlength="20" autocomplete="nickname">
			<button type="submit" id="start">Start playing</button>
			<p class="status" id="status" aria-live="polite"></p>
		</form>
	</div>
</body>
</html>
